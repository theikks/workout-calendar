<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>운동 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--card:#14181d;--card2:#1b2027;--ink:#f2f4f7;--mute:#8a94a3;--line:#242a33;--lime:#c6ff3d;--ink-on-lime:#0b0d10}
*{box-sizing:border-box}
html{font-size:16px}
@media(min-width:900px){html{font-size:18px}}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#1c2a10 0,transparent 60%),var(--bg);color:var(--ink);font:1rem/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
.num,h1,.big{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;letter-spacing:.01em}
main{max-width:1120px;margin:0 auto;padding:16px}
@media(min-width:900px){main{padding:32px}}

/* top */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;color:var(--lime);font-size:.75rem;letter-spacing:.25em;font-weight:700}
h1{margin:0;font-size:2.4rem;line-height:1;text-transform:uppercase}
h1 span{color:var(--lime)}
.nav{display:flex;gap:8px;align-items:center}
.nav .m{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:1.6rem;min-width:4.5em;text-align:center}
.nav button{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
.nav button:hover{border-color:var(--lime);color:var(--lime)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.8rem}
.stat.hot b{color:var(--lime)}

/* layout */
.wrap{display:grid;gap:18px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 340px;align-items:start}}

/* calendar */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(min-width:900px){.grid{gap:8px}}
.dow{text-align:center;color:var(--mute);font-size:.8rem;font-weight:700;letter-spacing:.1em;padding:4px 0}
.cell{--c:#64748b;position:relative;min-width:0;min-height:64px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);font:inherit;text-align:left;cursor:pointer;overflow:hidden;transition:transform .12s,border-color .12s}
@media(min-width:900px){.cell{min-height:96px;padding:8px 10px;border-radius:14px}}
.cell:hover{transform:translateY(-2px);border-color:var(--c)}
.cell.empty{background:transparent;border:0;cursor:default;pointer-events:none}
.cell .n{font-size:1.15rem;line-height:1;color:var(--mute)}
.cell .t{font-size:1.1rem;line-height:1}
@media(min-width:900px){.cell .n{font-size:1.4rem}.cell .t{font-size:1.4rem}}
.cell .bar{height:4px;border-radius:2px;background:#ffffff14;overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--c)}
.cell.rest{opacity:.55}
.cell.none{border-top-color:transparent}
.cell.sel{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}
.cell.today .n{color:var(--lime)}
.cell.today::after{content:"TODAY";position:absolute;top:6px;right:6px;font-size:.5rem;font-weight:800;letter-spacing:.12em;color:var(--lime)}
@media(max-width:899px){.cell.today::after{display:none}.cell.today{border-color:var(--lime)}}
.cell.done{background:var(--c)}
.cell.done .n,.cell.done .t{color:#0b0d10}
.cell.done .bar{background:#0b0d1030}.cell.done .bar i{background:#0b0d10}
.cell.done::before{content:"✓";position:absolute;right:8px;bottom:12px;font-size:1.3rem;font-weight:900;color:#0b0d10}

/* detail */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
@media(min-width:900px){.panel{position:sticky;top:24px}}
.panel .tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.15em;padding:3px 10px;border-radius:99px;background:var(--c);color:#0b0d10}
.panel h2{margin:8px 0 2px;font-size:1.7rem;line-height:1.1}
.panel p{margin:0 0 12px;color:var(--mute);font-size:.85rem}
.pbar{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden;margin:6px 0 10px}
.pbar i{display:block;height:100%;background:var(--c);transition:width .25s}
label.item{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
label.item input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border:2px solid #4a5463;border-radius:8px;margin-top:1px;display:grid;place-items:center;cursor:pointer;background:transparent}
label.item input:checked{background:var(--c);border-color:var(--c)}
label.item input:checked::after{content:"✓";color:#0b0d10;font-weight:900;font-size:.9rem}
label.item input:checked+span{color:var(--mute);text-decoration:line-through}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.row .pri{background:var(--lime);border-color:var(--lime);color:var(--ink-on-lime)}
.hint{color:var(--mute);font-size:.8rem;margin-top:16px}
dialog{border:0;border-radius:20px;padding:0;width:min(94vw,440px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000a}
dialog .panel{border:0;position:static}
@media(min-width:900px){dialog{display:none}}
@media(max-width:899px){#side{display:none}}

/* A layout (dots) + per-workout colors */
.cell{background:transparent;border:1px solid transparent;border-top:1px solid transparent;align-items:center;justify-content:center;gap:5px;text-align:center;min-height:56px;padding:4px}
@media(min-width:900px){.cell{min-height:84px;gap:7px}}
.cell:hover{background:var(--card);border-color:var(--line);transform:none}
.cell .n{color:var(--ink);font-size:1.1rem}
@media(min-width:900px){.cell .n{font-size:1.35rem}}
.cell .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);box-sizing:border-box;background:conic-gradient(var(--c) calc(var(--p,0)*1%),transparent 0)}
@media(min-width:900px){.cell .dot{width:13px;height:13px}}
.cell.rest .dot,.cell.none .dot{visibility:hidden}
.cell.rest .n,.cell.none .n{color:var(--mute)}
.cell.rest{opacity:1}
.cell .tg{display:none;font-size:.55rem;font-weight:800;letter-spacing:.12em;color:var(--c);min-height:.8em}
@media(min-width:900px){.cell .tg{display:block}}
.cell.done{background:transparent}
.cell.done .n,.cell.done .t{color:var(--ink)}
.cell.done::before{content:none}
.cell.today{border-color:var(--lime);background:#c6ff3d14}
.cell.today::after{content:none}
.cell.today .n{color:var(--lime)}
.cell.sel{background:var(--card2);box-shadow:none;border-color:var(--lime)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:.75rem;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cell.today{border-color:#ff2e97;background:#ff2e9714;box-shadow:0 0 0 1px #ff2e9766,0 0 12px #ff2e9755;outline:0}
.cell.today .n{color:#ff2e97}
.cell.sel:not(.today){border-color:var(--line);background:var(--card2)}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><small>BABITALK · HYOIK</small><h1>Workout <span>Log</span></h1></div>
    <div class="nav"><button id="prev" aria-label="이전 달">‹</button><div class="m" id="title"></div><button id="next" aria-label="다음 달">›</button></div>
  </div>
  <div class="stats">
    <div class="stat"><b class="num" id="s1">0</b><span>이번 달 완료</span></div>
    <div class="stat hot"><b class="num" id="s2">0</b><span>🔥 연속일</span></div>
    <div class="stat"><b class="num" id="s3">0%</b><span>이번 달 달성률</span></div>
  </div>
  <div class="wrap">
    <div><div class="grid" id="grid"></div><div class="legend" id="legend"></div><p class="hint">날짜를 눌러 운동 체크리스트를 열어요. 기록은 이 기기 브라우저에만 저장돼요.</p></div>
    <aside id="side"></aside>
  </div>
</main>
<dialog id="dlg"></dialog>
<script>
// 1주차 월요일. 첫 운동일은 2026-10-21(수)
const START = new Date(2026, 9, 19), FIRST = new Date(2026, 9, 21);
const CARDIO = "🚴 유산소 15분 (자전거/인클라인, 러닝X)";
const STAIRS = "🪜 천국의계단 10분 (Lv4~6, 손잡이 기대지X)";
const DAYS = [
  {c: "#3b82f6", tag: "BACK", t: "💪", title: "등 + 이두", w: true, items: [CARDIO, "랫풀다운", "시티드 케이블로우", "원암 덤벨로우", "스트레이트암 풀다운", "백익스텐션", "덤벨컬", STAIRS]},
  {c: "#a855f7", tag: "SHOULDER", t: "🏋️", title: "어깨 + 코어", w: true, items: [CARDIO, "앉아서 숄더프레스", "사이드 레터럴레이즈", "리어델트 플라이", "페이스풀", "덤벨 슈러그", "데드버그 3x10 / 플랭크 3x40초", STAIRS]},
  {c: "#f97316", tag: "CHEST", t: "🔥", title: "가슴 + 삼두", w: true, items: [CARDIO, "체스트프레스 / 덤벨벤치 (무게 욕심X)", "인클라인 덤벨프레스", "펙덱 플라이", "케이블 푸시다운", "오버헤드 케이블 익스텐션", STAIRS]},
  {c: "#22c55e", tag: "LEGS", t: "🦵", title: "하체 (무릎 재활)", w: true, items: ["🚴 자전거 15분 + 클램쉘·브릿지 2x15", "한다리 레그프레스 (왼쪽 먼저, 90°까지)", "양발 레그프레스 (발 높게, 90°)", "덤벨 RDL", "힙쓰러스트", "레그컬", "레그익스텐션 가볍게", "어브덕션/어덕션 2x15", "카프레이즈", "🪜 천국의계단 5분 or 자전거"]},
  {c: "#eab308", tag: "FREE", t: "🎯", title: "자유운동 (약점보완)", free: true, items: ["🚴 자전거 or 인클라인 걷기 20분"]},
  {c: "#64748b", tag: "REST", t: "😴", title: "휴식", rest: true, items: []},
  {c: "#c6ff3d", tag: "TENNIS", t: "🎾", title: "테니스 9시", items: ["🔥 8:30 워밍업 10분 (발목·무릎 돌리기, 제자리 스텝)", "테니스 (급정지·방향전환 때 왼무릎 주의)", "스트레칭 (허벅지·종아리)"]},
];
const FREE = [
  ["전신 서킷 3바퀴", "고블릿 박스스쿼트", "덤벨로우", "푸시업", "데드버그", "플랭크"],
  ["하체 균형", "한발서기 30초x3", "힙쓰러스트", "클램쉘", "카프레이즈", "코어"],
  ["상체 약점", "인클라인 푸시업", "페이스풀", "사이드레이즈", "케이블 크런치", "걷기 30분"],
];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function planOf(d) {
  if (d < FIRST) return null;
  const dow = (d.getDay() + 6) % 7, week = Math.floor((d - START) / 6048e5) + 1, p = DAYS[dow];
  let items = p.items, sub = "";
  if (p.w) sub = week <= 4 ? "3세트×12~15회 (2~3개 여유), 휴식 60~90초" : "4세트×8~12회, 상한 채우면 무게 +2.5~5%";
  if (p.free) { const f = FREE[(week - 1) % 3]; sub = f[0]; items = [...items, ...f.slice(1)]; }
  return {...p, items, sub, week};
}
let store = {};
try { store = JSON.parse(localStorage.getItem("workout-checks") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("workout-checks", JSON.stringify(store)); } catch (e) {} };
const checked = k => store[k] || [];
const isDone = (k, p) => p && !p.rest && p.items.length && checked(k).length >= p.items.length;

const $ = id => document.getElementById(id);
const wide = () => matchMedia("(min-width:900px)").matches;
let view = new Date(); view.setDate(1);
let sel = new Date();

function streak() {
  let n = 0;
  for (let i = 0, d = new Date(); i < 150; i++, d.setDate(d.getDate() - 1)) {
    const p = planOf(d); if (!p) break;
    if (p.rest) continue;
    if (isDone(ymd(d), p)) n++;
    else if (i > 0) break;
  }
  return n;
}

function render() {
  const y = view.getFullYear(), m = view.getMonth(), g = $("grid");
  $("title").textContent = `${y}.${String(m + 1).padStart(2, "0")}`;
  g.replaceChildren();
  "월화수목금토일".split("").forEach(c => { const e = document.createElement("div"); e.className = "dow"; e.textContent = c; g.append(e); });
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, last = new Date(y, m + 1, 0).getDate(), today = ymd(new Date());
  for (let i = 0; i < lead; i++) { const e = document.createElement("div"); e.className = "cell empty"; g.append(e); }
  let planned = 0, done = 0;
  for (let n = 1; n <= last; n++) {
    const d = new Date(y, m, n), k = ymd(d), p = planOf(d), b = document.createElement("button");
    b.className = "cell"; b.type = "button";
    const total = p ? p.items.length : 0, c = checked(k).length;
    if (p) b.style.setProperty("--c", p.c); else b.classList.add("none");
    if (p && !p.rest) { planned++; if (isDone(k, p)) { done++; b.classList.add("done"); } }
    if (p && p.rest) b.classList.add("rest");
    if (k === today) b.classList.add("today");
    if (k === ymd(sel)) b.classList.add("sel");
    b.innerHTML = `<span class="n num">${n}</span><span class="dot"></span><span class="tg">${p && !p.rest ? p.tag : ""}</span>`;
    b.style.setProperty("--p", total ? Math.min(100, c / total * 100) : 0);
    b.onclick = () => { sel = d; render(); if (!wide()) dlg.showModal(); };
    g.append(b);
  }
  $("s1").textContent = `${done}/${planned}`;
  $("s2").textContent = streak();
  $("s3").textContent = (planned ? Math.round(done / planned * 100) : 0) + "%";
  (wide() ? $("side") : dlg).replaceChildren(detail(sel));
}

function detail(d) {
  const p = planOf(d), k = ymd(d), el = document.createElement("div");
  el.className = "panel";
  if (!p) { el.innerHTML = `<h2 class="big">${d.getMonth()+1}/${d.getDate()}</h2><p>운동 시작 전이에요 (첫 운동일 10/21)</p>`; return el; }
  el.style.setProperty("--c", p.c);
  const c = checked(k).length, total = p.items.length;
  el.innerHTML = `<span class="tag">${p.tag}</span><h2 class="big">${p.t} ${d.getMonth()+1}/${d.getDate()} ${p.title}</h2><p></p><div class="pbar"><i style="width:${total ? c / total * 100 : 0}%"></i></div><div class="list"></div><div class="row"></div>`;
  el.querySelector("p").textContent = `${p.week}주차${p.sub ? " · " + p.sub : ""}${total ? ` · ${c}/${total}` : ""}`;
  const list = el.querySelector(".list");
  if (!total) list.textContent = "푹 쉬는 날이에요. 걷기 정도만 가볍게!";
  p.items.forEach((t, i) => {
    const l = document.createElement("label"), cb = document.createElement("input"), s = document.createElement("span");
    l.className = "item"; cb.type = "checkbox"; cb.checked = checked(k).includes(i); s.textContent = t;
    cb.onchange = () => { const a = new Set(checked(k)); cb.checked ? a.add(i) : a.delete(i); store[k] = [...a]; save(); render(); };
    l.append(cb, s); list.append(l);
  });
  const row = el.querySelector(".row");
  if (total) { const a = document.createElement("button"); a.className = "pri"; a.textContent = "전부 완료"; a.onclick = () => { store[k] = p.items.map((_, i) => i); save(); render(); }; row.append(a); }
  if (!wide()) { const x = document.createElement("button"); x.textContent = "닫기"; x.onclick = () => dlg.close(); row.append(x); }
  return el;
}

const dlg = $("dlg");
$("legend").innerHTML = DAYS.filter(d => !d.rest).map(d => `<span><i style="background:${d.c}"></i>${d.title.split(" ")[0]}</span>`).join("");
$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
matchMedia("(min-width:900px)").addEventListener("change", render);
render();
</script>
</body>
</html>
