<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>운동 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--card:#14181d;--card2:#1b2027;--ink:#f2f4f7;--mute:#8a94a3;--line:#242a33;--lime:#c6ff3d;--limefill:#c6ff3d;--pink:#ff2e97;--sky:#38bdf8;--track:#ffffff14;--cb:#4a5463;--glow:#1c2a10;--tennis:#c6ff3d}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6f8;--card:#ffffff;--card2:#eceff3;--ink:#12161b;--mute:#5d6877;--line:#dde2e8;--lime:#4a7a00;--limefill:#c6ff3d;--pink:#e0126f;--sky:#0284c7;--track:#0000000f;--cb:#a3adba;--glow:#e6f5c8;--tennis:#7fb800}}
:root[data-theme=light]{--bg:#f4f6f8;--card:#ffffff;--card2:#eceff3;--ink:#12161b;--mute:#5d6877;--line:#dde2e8;--lime:#4a7a00;--limefill:#c6ff3d;--pink:#e0126f;--sky:#0284c7;--track:#0000000f;--cb:#a3adba;--glow:#e6f5c8;--tennis:#7fb800}
*{box-sizing:border-box}
html{font-size:16px}
@media(min-width:900px){html{font-size:18px}}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,var(--glow) 0,transparent 60%),var(--bg);color:var(--ink);font:1rem/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;min-height:100vh}
.num,h1,.big{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-style:italic;font-weight:800;letter-spacing:.01em}
button{font:inherit;color:inherit}
main{max-width:1120px;margin:0 auto;padding:16px}
@media(min-width:900px){main{padding:32px}}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;color:var(--lime);font-size:.75rem;letter-spacing:.25em;font-weight:700}
h1{margin:0;font-size:2.4rem;line-height:1;text-transform:uppercase}
h1 span{color:var(--lime)}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav #themebtn{font-size:1.1rem}
.nav .syncb{width:auto;height:44px;padding:0 10px;font-size:.78rem;font-weight:700;color:var(--mute);white-space:nowrap}
.nav .syncb[data-st=ok]{color:var(--sky);border-color:var(--sky)}
.nav .syncb[data-st=err]{color:var(--pink);border-color:var(--pink)}
.nav .m{white-space:nowrap}
@media(max-width:420px){.nav{gap:6px}.nav button{width:40px;height:40px}.nav .syncb{height:40px}.nav .m{min-width:3.9em;font-size:1.4rem}}
.nav .m{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:800;font-size:1.6rem;min-width:4.5em;text-align:center}
.nav button{background:var(--card2);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
.nav button:hover{border-color:var(--lime);color:var(--lime)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{color:var(--mute);font-size:.8rem}
.stat.hot b{color:var(--lime)}
.stat.sky b{color:var(--sky)}

.wrap{display:grid;gap:18px}
@media(min-width:900px){.wrap{grid-template-columns:1fr 380px;align-items:start}}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media(min-width:900px){.grid{gap:8px}}
.dow{text-align:center;color:var(--mute);font-size:.8rem;font-weight:700;letter-spacing:.1em;padding:4px 0}
.cell{--c:#64748b;position:relative;min-width:0;min-height:62px;background:transparent;border:1px solid transparent;border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);text-align:center;cursor:pointer;overflow:hidden}
@media(min-width:900px){.cell{min-height:88px;gap:6px;border-radius:14px}}
.cell:hover{background:var(--card);border-color:var(--line)}
.cell.empty{border:0;cursor:default;pointer-events:none}
.cell .n{font-size:1.1rem;line-height:1}
@media(min-width:900px){.cell .n{font-size:1.35rem}}
.cell .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--c);box-sizing:border-box;background:conic-gradient(var(--c) calc(var(--p,0)*1%),transparent 0)}
@media(min-width:900px){.cell .dot{width:13px;height:13px}}
.cell.rest .dot,.cell.none .dot{visibility:hidden}
.cell.rest .n,.cell.none .n{color:var(--mute)}
.cell .tg{display:none;font-size:.55rem;font-weight:800;letter-spacing:.12em;color:var(--c);min-height:.8em}
@media(min-width:900px){.cell .tg{display:block}}
.cell .dg{width:60%;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.cell .dg i{display:block;height:100%;background:var(--sky);width:var(--d,0%)}
.cell.today{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 8%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--pink) 40%,transparent),0 0 12px color-mix(in srgb,var(--pink) 30%,transparent)}
.cell.today .n{color:var(--pink)}
.cell.sel:not(.today){border-color:var(--line);background:var(--card2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:.75rem;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.bar{width:14px;height:4px;border-radius:2px;vertical-align:2px}
.hint{color:var(--mute);font-size:.8rem;margin-top:12px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
@media(min-width:900px){.panel{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.15em;padding:3px 10px;border-radius:99px;background:var(--c,#64748b);color:#0b0d10}
.panel h2{margin:8px 0 2px;font-size:1.6rem;line-height:1.1}
.panel .sub{margin:0 0 10px;color:var(--mute);font-size:.82rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 12px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--card2);color:var(--ink)}
.pbar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin:4px 0 6px}
.pbar i{display:block;height:100%;background:var(--c,var(--lime));transition:width .25s}
.sec{margin:14px 0 2px;font-size:.78rem;font-weight:800;letter-spacing:.06em;color:var(--c,var(--lime))}
.sec small{color:var(--mute);font-weight:400;letter-spacing:0;margin-left:6px}
label.item{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;font-size:.92rem}
label.item input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--cb);border-radius:7px;margin-top:1px;display:grid;place-items:center;cursor:pointer;background:transparent}
label.item input:checked{background:var(--c,var(--lime));border-color:var(--c,var(--lime))}
label.item input:checked::after{content:"✓";color:#0b0d10;font-weight:900;font-size:.85rem}
label.item span{flex:1}
.gbtn{flex:none;align-self:center;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:3px 10px;font-size:.72rem;font-weight:700;cursor:pointer;color:var(--mute)}
.gbtn.on,.gbtn:hover{border-color:var(--c);color:var(--c)}
.guide{background:var(--bg);border-radius:12px;padding:10px 12px;margin:2px 0 8px}
.guide svg{display:block;width:100%;max-width:260px;height:auto;margin:0 auto 6px}
.guide ul{margin:0;padding-left:18px;font-size:.84rem;line-height:1.55}
.guide a{display:inline-block;margin-top:6px;font-size:.8rem;color:var(--sky)}
label.item input:checked+span{color:var(--mute);text-decoration:line-through}
.row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:700;cursor:pointer}
.btn.pri{background:var(--limefill);border-color:var(--limefill);color:#0b0d10}
.btn.sm{flex:none;padding:6px 12px;font-size:.8rem;border-radius:9px}

/* diet */
.macro{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.macro div{background:var(--bg);border-radius:12px;padding:10px 12px}
.macro b{font-size:1.6rem;line-height:1}
.macro small{color:var(--mute);font-size:.75rem;display:block}
.macro .p{--c:var(--sky)}
.macro .k{--c:var(--lime)}
.slot{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.slot h3{margin:0;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.ent{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:.88rem}
.ent .m{color:var(--mute);font-size:.75rem;white-space:nowrap}
.ent button{background:none;border:0;color:var(--mute);cursor:pointer;padding:0 4px}
.est{font-size:.62rem;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:1px}
.rec{background:var(--bg);border-radius:14px;padding:12px;margin-top:14px}
.rec h4{margin:0 0 6px;font-size:.85rem}
.rec .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.rec .opt span.m{display:block;color:var(--mute);font-size:.75rem}
.rec .rcp{margin-top:3px;line-height:1.45}
.rec p{margin:0 0 4px;color:var(--mute);font-size:.8rem}
.pick{background:var(--bg);border-radius:12px;padding:10px;margin:8px 0}
.pick input[type=search],.pick input[type=text],.pick input[type=number]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--ink);font:inherit;font-size:.9rem}
.pick .list{max-height:240px;overflow:auto;margin-top:8px}
.pick .g{font-size:.7rem;font-weight:800;color:var(--lime);margin:8px 0 2px;letter-spacing:.06em}
.pick .f{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;cursor:pointer;font-size:.86rem}
.pick .f:hover{background:var(--card)}
.pick .f .m{color:var(--mute);font-size:.75rem;white-space:nowrap}
.pick .cu{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px;margin-top:8px}
.water{margin-top:14px}

#sdlg{display:block}
#sdlg:not([open]){display:none}
html.lock,html.lock body{overflow:hidden;height:100%}
dialog{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
dialog{border:0;border-radius:20px;padding:0;width:min(94vw,460px);max-height:92vh;background:var(--card);color:var(--ink);overflow:auto}
dialog::backdrop{background:#000a}
.xbar{position:sticky;top:8px;z-index:5;height:0;display:flex;justify-content:flex-end;margin:-4px 0 0}
.xbar .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:1rem;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px #0003}
.xbar .x:hover{border-color:var(--lime);color:var(--lime)}
dialog .panel h2{padding-right:44px}
dialog .panel{border:0;position:static;max-height:none;overflow:visible}
@media(min-width:900px){dialog{display:none}}
@media(max-width:899px){#side{display:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><small>HYOIK</small><h1>Workout <span>Log</span></h1></div>
    <div class="nav"><button id="themebtn" type="button" aria-label="테마 전환">🌓</button><button id="syncbtn" class="syncb" data-st="off" type="button">☁ 동기화</button><button id="prev" aria-label="이전 달">‹</button><div class="m" id="title"></div><button id="next" aria-label="다음 달">›</button></div>
  </div>
  <div class="stats">
    <div class="stat"><b class="num" id="s1">0</b><span>이번 달 운동 완료</span></div>
    <div class="stat hot"><b class="num" id="s2">0</b><span>🔥 연속일</span></div>
    <div class="stat"><b class="num" id="s3">0%</b><span>이번 달 달성률</span></div>
    <div class="stat sky"><b class="num" id="s4">-</b><span>평균 단백질(g/일)</span></div>
  </div>
  <div class="wrap">
    <div><div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
      <p class="hint">날짜를 눌러 운동·식단을 체크하세요. 기록은 이 기기 브라우저에만 저장돼요.</p></div>
    <aside id="side"></aside>
  </div>
</main>
<dialog id="dlg"></dialog>
<dialog id="sdlg"></dialog>
<script>
const h = (t, a = {}, ...c) => { const e = document.createElement(t); for (const k in a) { if (k === "class") e.className = a[k]; else if (k === "style") e.style.cssText = a[k]; else if (k.startsWith("on")) e[k] = a[k]; else e.setAttribute(k, a[k]); } c.flat().forEach(x => e.append(x instanceof Node ? x : document.createTextNode(x ?? ""))); return e; };
const $ = id => document.getElementById(id);
const r1 = n => Math.round(n);

/* ---------- 일정 ---------- */
// 1주차 월요일. 첫 운동일 2026-10-21(수). 구내식당은 12/21부터
const START = new Date(2026, 9, 19), FIRST = new Date(2026, 9, 21), CANTEEN = new Date(2026, 11, 21);
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const ROLL = {
  0: ["등 위쪽(흉추)", "광배 (양쪽)", "엉덩이 (양쪽)", "허벅지 앞 (양쪽)", "허벅지 뒤 (양쪽)", "종아리 (양쪽)"],
  1: ["등 위쪽(흉추)", "광배 (양쪽)", "가슴 옆 (벽에 대고)", "엉덩이 (양쪽)", "허벅지 앞 (양쪽)", "종아리 (양쪽)"],
  2: ["등 위쪽(흉추)", "가슴 옆 (벽에 대고)", "광배 (양쪽)", "엉덩이 (양쪽)", "허벅지 뒤 (양쪽)", "종아리 (양쪽)"],
  3: ["엉덩이 (양쪽)", "허벅지 앞 (양쪽)", "허벅지 뒤 (양쪽)", "종아리 (양쪽)", "등 위쪽(흉추)"],
};
// [이름, 반복, 세트(생략 시 주차별 3~4세트)]
const W = {
  0: [["랫풀다운", "10~12회"], ["시티드 케이블 로우", "12회"], ["원암 덤벨 로우 (한쪽씩)", "12회"], ["스트레이트암 풀다운", "15회"], ["덤벨 컬", "12회"], ["백익스텐션", "15회", 2]],
  1: [["앉아서 숄더프레스", "10~12회"], ["사이드 레터럴 레이즈", "15회"], ["리어델트 플라이", "15회"], ["덤벨 슈러그", "12회"], ["데드버그", "10회"], ["플랭크", "40초"]],
  2: [["체스트프레스", "10~12회"], ["인클라인 덤벨 프레스", "10~12회"], ["펙덱 플라이", "12~15회"], ["케이블 푸시다운", "12~15회"], ["오버헤드 케이블 익스텐션", "12회", 2], ["케이블 크런치", "15회"]],
  3: [["한다리 레그프레스 (왼쪽 먼저, 90°까지)", "12회"], ["덤벨 루마니안 데드리프트", "10~12회"], ["힙쓰러스트", "12회"], ["레그컬", "12회"], ["레그익스텐션 (가볍게, 끝에서 1초)", "15회"], ["케이블 TKE (왼쪽 먼저, 무릎 끝까지 펴기)", "15회"], ["힙 어브덕션 + 어덕션", "각 15회", 2], ["카프레이즈", "15회"]],
};
// 매일 공통: 목이 자주 아파서 폼롤러 대신 손·벽 마사지볼로 (목은 폼롤러로 직접 굴리지 않기)
const NECK = {h: "목·어깨 풀기", note: "2분 · 목은 폼롤러 대신 손·마사지볼, 아픈 곳은 5초 멈추기", items: [
  "턱 당기기 10회 (벽에 등 대고, 5초 유지)",
  "목 옆 스트레칭 · 좌우 각 20초 (반대 손으로 가볍게)",
  "승모근 마사지볼 · 벽에 기대 좌우 각 30초",
  "견갑 조이기 10회 (어깨뼈를 뒤로 모으기)",
]};
const FREE = [
  ["전신 서킷 3바퀴", "고블릿 박스스쿼트", "덤벨로우", "푸시업", "데드버그", "플랭크"],
  ["하체 균형", "한발서기 30초×3", "힙쓰러스트", "클램쉘", "카프레이즈", "코어"],
  ["상체 약점", "인클라인 푸시업", "페이스풀", "사이드레이즈", "케이블 크런치", "걷기 30분"],
];
const TYPE = [
  {c: "#3b82f6", tag: "BACK", title: "등 + 이두"},
  {c: "#a855f7", tag: "SHOULDER", title: "어깨 + 코어"},
  {c: "#f97316", tag: "CHEST", title: "가슴 + 삼두"},
  {c: "#22c55e", tag: "LEGS", title: "하체 (무릎 재활)"},
  {c: "#eab308", tag: "FREE", title: "자유운동 (약점보완)"},
  {c: "#64748b", tag: "REST", title: "휴식", rest: true},
  {c: "var(--tennis)", tag: "TENNIS", title: "테니스 9시"},
];

function planOf(d) {
  if (d < FIRST) return null;
  const dow = (d.getDay() + 6) % 7, week = Math.floor((d - START) / 6048e5) + 1, T = TYPE[dow];
  const S = week <= 4 ? 3 : 4, groups = [];
  let sub = "";
  if (dow <= 3) {
    const leg = dow === 3;
    sub = `세트 ${S}×(위 반복수) · 휴식 60~90초 · 종목마다 첫 세트는 가볍게`;
    groups.push({h: "폼롤러", note: "8분 · 부위당 30~40초, 무릎뼈 위는 피하기", items: ROLL[dow].map(x => x)});
    groups.push(NECK);
    groups.push({h: "유산소", note: "30분 · 심박 130~145 목표", items: [
      "워밍업 1분 30초 · 4.5km/h · 경사 2%",
      "전환 30초 · 4.4km/h · 경사 6.5%",
      leg ? "메인 26분 · 4.3km/h · 경사 6~8% (하체날은 낮게)" : "메인 26분 · 4.3km/h · 경사 10%",
      "마무리 2분 · 빠르게 걷기 5.5km/h · 경사 3% (힘들면 4.5)",
    ]});
