<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운동 캘린더</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mute:#6b7380;--line:#e4e7ec;--acc:#2f6fed;--done:#1fa971;--rest:#aab1bd}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#eef0f3;--mute:#8d96a3;--line:#262c35;--acc:#6b9bff;--done:#34c88a;--rest:#59616e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 4px}
h1{font-size:20px;margin:0}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.stat{color:var(--mute);font-size:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;color:var(--mute);font-size:13px;padding:4px 0}
.cell{min-width:0;min-height:62px;overflow:hidden;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.cell.empty{background:transparent;border:0;cursor:default}
.cell .n{font-size:12px;color:var(--mute)}
.cell .t{font-size:16px;line-height:1}
.cell .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.cell .bar i{display:block;height:100%;background:var(--acc)}
.cell.today{outline:2px solid var(--acc)}
.cell.done{background:color-mix(in srgb,var(--done) 18%,var(--card));border-color:var(--done)}
.cell.done .bar i{background:var(--done)}
.cell.rest .t{opacity:.45}
.legend{color:var(--mute);font-size:13px;margin-top:16px;clear:both}
dialog{border:0;border-radius:16px;padding:0;width:min(92vw,440px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.box{padding:18px}
.box h2{margin:0 0 2px;font-size:18px}
.box p{margin:0 0 12px;color:var(--mute);font-size:14px}
label.item{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
label.item input{width:22px;height:22px;margin-top:1px;accent-color:var(--done);flex:none}
label.item input:checked+span{color:var(--mute);text-decoration:line-through}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.row .pri{background:var(--done);border-color:var(--done);color:#fff}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <div class="nav"><button id="prev" aria-label="이전 달">‹</button> <button id="next" aria-label="다음 달">›</button></div>
  </header>
  <p class="stat" id="stat"></p>
  <div class="grid" id="grid"></div>
  <p class="legend">날짜를 누르면 오늘 운동 체크리스트가 열려요. 기록은 이 기기 브라우저에만 저장돼요.</p>
</main>
<dialog id="dlg"><div class="box">
  <h2 id="dt"></h2><p id="ds"></p>
  <div id="list"></div>
  <div class="row"><button id="all" class="pri">전부 완료</button><button id="close">닫기</button></div>
</div></dialog>
<script>
// 1주차 월요일. 첫 운동일은 2026-10-21(수)
const START = new Date(2026, 9, 19), FIRST = new Date(2026, 9, 21);
const CARDIO = "🚴 유산소 15분 (자전거/인클라인, 러닝X)";
const STAIRS = "🪜 천국의계단 10분 (Lv4~6, 손잡이 기대지X)";
const DAYS = [
  {t: "💪", title: "등+이두", w: true, items: [CARDIO, "랫풀다운", "시티드 케이블로우", "원암 덤벨로우", "스트레이트암 풀다운", "백익스텐션", "덤벨컬", STAIRS]},
  {t: "🏋️", title: "어깨+코어", w: true, items: [CARDIO, "앉아서 숄더프레스", "사이드 레터럴레이즈", "리어델트 플라이", "페이스풀", "덤벨 슈러그", "데드버그 3x10 / 플랭크 3x40초", STAIRS]},
  {t: "🔥", title: "가슴+삼두", w: true, items: [CARDIO, "체스트프레스 / 덤벨벤치 (무게 욕심X)", "인클라인 덤벨프레스", "펙덱 플라이", "케이블 푸시다운", "오버헤드 케이블 익스텐션", STAIRS]},
  {t: "🦵", title: "하체 (무릎 재활)", w: true, items: ["🚴 자전거 15분 + 클램쉘·브릿지 2x15", "한다리 레그프레스 (왼쪽 먼저, 90°까지)", "양발 레그프레스 (발 높게, 90°)", "덤벨 RDL", "힙쓰러스트", "레그컬", "레그익스텐션 가볍게", "어브덕션/어덕션 2x15", "카프레이즈", "🪜 천국의계단 5분 or 자전거"]},
  {t: "🎯", title: "자유운동 (약점보완)", free: true, items: ["🚴 자전거 or 인클라인 걷기 20분"]},
  {t: "😴", title: "휴식", rest: true, items: []},
  {t: "🎾", title: "테니스 9시", items: ["🔥 8:30 워밍업 10분 (발목·무릎 돌리기, 제자리 스텝)", "테니스 (급정지·방향전환 때 왼무릎 주의)", "스트레칭 (허벅지·종아리)"]},
];
const FREE = [
  ["전신 서킷 3바퀴", "고블릿 박스스쿼트", "덤벨로우", "푸시업", "데드버그", "플랭크"],
  ["하체 균형", "한발서기 30초x3", "힙쓰러스트", "클램쉘", "카프레이즈", "코어"],
  ["상체 약점", "인클라인 푸시업", "페이스풀", "사이드레이즈", "케이블 크런치", "걷기 30분"],
];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function planOf(d) {
  if (d < FIRST) return null;
  const dow = (d.getDay() + 6) % 7, week = Math.floor((d - START) / 6048e5) + 1, p = DAYS[dow];
  let items = p.items, sub = "";
  if (p.w) sub = week <= 4 ? "3세트×12~15회 (2~3개 여유), 휴식 60~90초" : "4세트×8~12회, 상한 채우면 무게 +2.5~5%";
  if (p.free) { const f = FREE[(week - 1) % 3]; sub = f[0]; items = [...items, ...f.slice(1)]; }
  return {...p, items, sub, week};
}
let store = {};
try { store = JSON.parse(localStorage.getItem("workout-checks") || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem("workout-checks", JSON.stringify(store)); } catch (e) {} };
const checked = k => store[k] || [];

let view = new Date(); view.setDate(1);
const $ = id => document.getElementById(id);

function render() {
  const y = view.getFullYear(), m = view.getMonth(), g = $("grid");
  $("title").textContent = `${y}년 ${m + 1}월`;
  g.replaceChildren();
  "월화수목금토일".split("").forEach(c => { const e = document.createElement("div"); e.className = "dow"; e.textContent = c; g.append(e); });
  const lead = (new Date(y, m, 1).getDay() + 6) % 7, last = new Date(y, m + 1, 0).getDate(), today = ymd(new Date());
  for (let i = 0; i < lead; i++) { const e = document.createElement("div"); e.className = "cell empty"; g.append(e); }
  let planned = 0, done = 0;
  for (let n = 1; n <= last; n++) {
    const d = new Date(y, m, n), k = ymd(d), p = planOf(d), b = document.createElement("button");
    b.className = "cell"; b.type = "button";
    const total = p ? p.items.length : 0, c = checked(k).length;
    if (p && !p.rest) { planned++; if (total && c >= total) { done++; b.classList.add("done"); } }
    if (p && p.rest) b.classList.add("rest");
    if (k === today) b.classList.add("today");
    b.innerHTML = `<span class="n">${n}</span><span class="t">${p ? p.t : ""}</span><span class="bar"><i style="width:${total ? Math.min(100, c / total * 100) : 0}%"></i></span>`;
    b.onclick = () => open(d);
    g.append(b);
  }
  $("stat").textContent = planned ? `이번 달 완료 ${done} / ${planned}일` : "운동 시작 전이에요";
}

let cur;
function open(d) {
  const p = planOf(d); if (!p) return;
  cur = {k: ymd(d), p};
  $("dt").textContent = `${p.t} ${d.getMonth()+1}/${d.getDate()} ${p.title}`;
  $("ds").textContent = p.sub ? `${p.week}주차 · ${p.sub}` : `${p.week}주차`;
  const list = $("list"); list.replaceChildren();
  if (!p.items.length) list.textContent = "푹 쉬는 날이에요. 걷기 정도만 가볍게!";
  p.items.forEach((t, i) => {
    const l = document.createElement("label"), c = document.createElement("input"), s = document.createElement("span");
    l.className = "item"; c.type = "checkbox"; c.checked = checked(cur.k).includes(i); s.textContent = t;
    c.onchange = () => { const a = new Set(checked(cur.k)); c.checked ? a.add(i) : a.delete(i); store[cur.k] = [...a]; save(); render(); };
    l.append(c, s); list.append(l);
  });
  $("all").hidden = !p.items.length;
  $("dlg").showModal();
}
$("all").onclick = () => { store[cur.k] = cur.p.items.map((_, i) => i); save(); render(); $("dlg").close(); };
$("close").onclick = () => $("dlg").close();
$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
render();
</script>
</body>
</html>
